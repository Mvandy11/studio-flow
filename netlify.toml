[build]
  command   = "cd server && npm install && cd .. && npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# ── Function configuration ──────────────────────────────────────
[functions]
  node_bundler = "esbuild"

# ── API routes → Netlify Function ──────────────────────────────
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api"
  status = 200
  force  = true

# ── SPA catch-all (must be last) ───────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
