[build]
  command = "pnpm install --no-frozen-lockfile && pnpm run build"
  publish = "dist/public"
[build.environment]
  NODE_VERSION        = "22"
  NETLIFY_USE_PNPM    = "true"

# ── SPA catch-all (must be last) ───────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
