[build]
  command = "pnpm install --no-frozen-lockfile && pnpm run build"
  publish = "dist/public"
[build.environment]
  NODE_VERSION        = "20"
  NETLIFY_USE_PNPM    = "true"
  NODE_OPTIONS        = "--max-old-space-size=4096"
  # Test mode key — remove after testing
  STRIPE_TEST_SECRET_KEY = "PLACEHOLDER"

[functions]
  node_bundler = "esbuild"

# ── SPA catch-all (must be last) ───────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' data: https://js.stripe.com https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' https://*.supabase.co blob:; connect-src 'self' https://*.supabase.co https://api.stripe.com https://checkout.stripe.com https://studio-flow-backend.onrender.com wss://studio-flow-backend.onrender.com; frame-src https://js.stripe.com https://hooks.stripe.com;"
