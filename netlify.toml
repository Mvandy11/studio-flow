[build]
  command   = "pnpm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# ── Function configuration ──────────────────────────────────────
[functions]
  node_bundler          = "esbuild"
  external_node_modules = ["sharp"]

# ── API routes → Netlify Function ──────────────────────────────
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api"
  status = 200
  force  = true

# ── SPA catch-all (must be last) ───────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
